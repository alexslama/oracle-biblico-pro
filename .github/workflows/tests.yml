name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "Flask>=3.0,<4.0" "flask-cors>=4.0,<6.0" "pytest>=7.4,<9.0"

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          SHAMIR_ENABLE_RAG: "0"
          SHAMIR_ENABLE_LLM: "0"
        run: python -m pytest -q
