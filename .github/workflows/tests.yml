name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-dev.txt

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt

      - name: CLI smoke test
        env:
          SHAMIR_ENABLE_RAG: "0"
          SHAMIR_ENABLE_LLM: "0"
        run: shamir doctor

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          SHAMIR_ENABLE_RAG: "0"
          SHAMIR_ENABLE_LLM: "0"
        run: python -m pytest -q
